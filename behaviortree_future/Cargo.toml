[package]
name = "behaviortree_future"
version = "0.2.0"
edition = "2024"

[features]
default = []

# Memory usage
test-dhat = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
# Async
reusable-box-future = "0.2.0"
ticked_async_executor = { version = "0.4" }
tokio-util = { version = "0.7" }
tokio = { version = "1.52", features = ["full"] }

#
static_assertions = "1.1.0"

# Error handling
anyhow = { version = "1.0" }

# Memory profiling
dhat = { version = "0.3.3" }

# Arena allocator
slab = { version = "0.4" }
